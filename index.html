function showDetail(i){selectedWindow=i;const cfg=DATA[currentIndex],s=cfg.scenarios[currentScenario],w=cfg.windows[i],c=s.cards[i]||['备选','2027/1/5—1/25','大高点备选','若11月未完成则关注1月','4258—4474'];const src=(SOURCES[currentIndex]||[])[i]||'按猫方法推导',isCat=src.includes('猫原观点');const d=document.getElementById('detail');d.style.borderColor=isCat?'#ff8a00':s.color;d.innerHTML=`<h2>${c[0]} · ${c[1]}</h2><span class="tag">${cfg.name} / ${s.label}情景</span><p><b>窗口性质：</b>${c[2]}</p><p><b>判断/触发：</b>${c[3]}</p><p><b>对应点位：</b><span class="${isCat?'cat':'infer'}">${c[4]}</span></p><p><b>技术动作：</b>${s.summary}</p><p><b>来源：</b><span class="${isCat?'cat':'infer'}">${src}</span></p>`;d.classList.add('show');updateChips();draw()}
function hideDetail(){selectedWindow=null;document.getElementById('detail').classList.remove('show');updateChips();draw()}
let dataStatus='内置数据';
async function refreshData(manual=false){dataStatus='更新中…';update();const codes={sh:'sh000001',star:'sh000688'};for(const key of Object.keys(codes)){try{const res=await fetch(`https://web.ifzq.gtimg.cn/appstock/app/fqkline/get?param=${codes[key]},day,,,80,qfq`,{cache:'no-store'});const js=await res.json(),d=js.data[codes[key]],rows=d.qfqday||d.day;DATA[key].candles=rows.slice(-30).map(r=>[r[0],+r[1],+r[2],+r[3],+r[4]]);DATA[key].close=+rows[rows.length-1][2];DATA[key].high=+rows[rows.length-1][3];}catch(e){console.warn('行情更新失败',key,e)}}dataStatus=manual?'K线已刷新':'K线已自动更新';update()}
function update(){const cfg=DATA[currentIndex],s=cfg.scenarios[currentScenario];document.getElementById('stateLine').innerHTML=`<b>${cfg.name}</b> ${cfg.close} · ${s.label}待确认 · ${dataStatus} <button id="refreshBtn" style="border:0;background:#eef2f7;border-radius:8px;padding:3px 6px;font-size:10px;color:#2374c6">刷新</button>`;setTimeout(()=>{const b=document.getElementById('refreshBtn');if(b)b.onclick=e=>{e.stopPropagation();refreshData(true)}},0);document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.index===currentIndex));document.querySelectorAll('.scenario').forEach(b=>b.classList.toggle('active',b.dataset.scenario===currentScenario));updateChips();if(selectedWindow!==null)showDetail(selectedWindow);else draw()}
document.querySelectorAll('.tab').forEach(b=>b.onclick=e=>{e.stopPropagation();currentIndex=b.dataset.index;selectedWindow=null;hideDetail();update()});
document.querySelectorAll('.scenario').forEach(b=>b.onclick=e=>{e.stopPropagation();currentScenario=b.dataset.scenario;selectedWindow=null;hideDetail();update()});
canvas.addEventListener('click',e=>{const x=e.offsetX;let hit=bandRects.find(([a,b])=>x>=a&&x<=b);if(hit)showDetail(hit[2]);else hideDetail()});
document.addEventListener('click',e=>{if(!e.target.closest('#detail')&&!e.target.closest('.chip')&&e.target!==canvas)hideDetail()});
window.addEventListener('resize',resize);update();resize();refreshData();
if('serviceWorker' in navigator && location.protocol.startsWith('http'))navigator.serviceWorker.register('./version.js?v=1.0.0', { scope: './' }).catch(e=>console.warn(e));</script></body></html>
